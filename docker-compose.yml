name: bothive

# ── Shared anchors ──────────────────────────────────────────────────────────

# Bounds each service's Prisma pool (default is CPU-based and can be large on
# big hosts), so a scaled worker fleet cannot exhaust Postgres connections.
x-db-url: &db-url postgresql://postgres:postgres@postgres:5432/bothive?connection_limit=10

# Optional Redis auth: when REDIS_PASSWORD is set every consumer passes it and
# the redis service starts with requirepass. Unset = open Redis (default).
x-redis-password: &redis-password ${REDIS_PASSWORD:-}

# Optional Sentry error tracking. Empty by default — the SDK stays a no-op in
# the API and workers until SENTRY_DSN is set (packages/core/src/utils/sentry.ts).
x-sentry-env: &sentry-env
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

# Optional OpenTelemetry tracing (docs/tracing.md). Empty by default — the API
# and workers stay untraced until OTEL_EXPORTER_OTLP_ENDPOINT is set (e.g. the
# bundled jaeger service below). Sampling defaults to 10% of root spans.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLE_RATE: ${OTEL_TRACES_SAMPLE_RATE:-0.1}

# Shared worker environment — used by all four platform workers via <<: *worker-env
x-worker-env: &worker-env
  DATABASE_URL: *db-url
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: *redis-password
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
  # Cap the worker heap so a long-lived process stays within its container
  # memory limit (docs/capacity-planning.md).
  NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-512}
  <<: [*sentry-env, *otel-env]

# Shared worker healthcheck: verifies Redis reachability from inside the
# workers container (see packages/workers/healthcheck.cjs).
x-worker-healthcheck: &worker-healthcheck
  test: ['CMD', 'node', '/app/packages/workers/healthcheck.cjs']
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

# Default log rotation for all services — prevents unbounded disk growth.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    # pg_stat_statements: per-query execution stats for slow-query triage
    # (docs/query-performance.md). shared_preload_libraries must be set before
    # the server starts, so it goes on the command line.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bothive
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - D:\bothive\data\pgdata:/var/lib/postgresql/data
      # Runs CREATE EXTENSION IF NOT EXISTS pg_stat_statements on fresh volumes
      # (docs/query-performance.md).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bothive']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Cap Redis memory (docs/capacity-planning.md). volatile-lru evicts only
      # TTL'd ephemeral keys (rate-limit counters, leases, dedup, bot memory)
      # under pressure; queue keys (no TTL) are protected from eviction.
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" \
            --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY" \
            --appendonly yes --appendfsync everysec
        else
          exec redis-server \
            --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY" \
            --appendonly yes --appendfsync everysec
        fi
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      # Persist AOF + RDB snapshots so Redis state survives container recreation.
      - D:\bothive\data\redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    image: ssrjkk/bothive-api
    build:
      context: .
      target: api
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set (see .env.example)}
      API_PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'true'
      EXPOSE_ERROR_STACK: ${EXPOSE_ERROR_STACK:-false}
      # Non-empty default keeps the API in Bearer-token mode so Prometheus can
      # actually scrape it (with an empty token it falls back to JWT auth, which
      # the scraper cannot satisfy and the ApiUnreachable alert fires forever).
      # Override with a strong random value before exposing anything publicly.
      METRICS_TOKEN: ${METRICS_TOKEN:-bothive-local}
      # HTTP/2 is opt-in (h2c prior-knowledge only). Leave off: the dashboard
      # nginx and the healthcheck speak HTTP/1.1, and cleartext h2c servers do
      # NOT fall back to HTTP/1.1 (allowHTTP1 needs a TLS/ALPN server). Enable
      # only if a TLS-terminating LB proxies to the API over h2c.
      API_HTTP2: 'false'
      <<: [*sentry-env, *otel-env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # One process per platform: a crash in one platform never takes down the
  # others, and each can be scaled independently (docker compose up --scale
  # workers-telegram=2). All share the same workers image.
  #
  # `workers` is a build-only target used by CI Trivy scans
  # (docker compose build workers → ssrjkk/bothive-workers:latest).
  workers:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers

  workers-telegram:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command:
      ['node', '--import', './dist/tracing-preload.js', './dist/index.js', '--platform', 'telegram']
    environment:
      <<: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    logging: *default-logging

  workers-twitch:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command:
      ['node', '--import', './dist/tracing-preload.js', './dist/index.js', '--platform', 'twitch']
    environment:
      <<: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    logging: *default-logging

  workers-youtube:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command:
      ['node', '--import', './dist/tracing-preload.js', './dist/index.js', '--platform', 'youtube']
    environment:
      <<: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    logging: *default-logging

  workers-twitter:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command:
      ['node', '--import', './dist/tracing-preload.js', './dist/index.js', '--platform', 'twitter']
    environment:
      <<: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    logging: *default-logging

  dashboard:
    image: ssrjkk/bothive-dashboard
    build:
      context: .
      target: dashboard
    ports:
      - '80:80'
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

  # ── Observability stack ─────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports: ['127.0.0.1:9090:9090']
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-bothive-local}
    entrypoint: [/bin/sh, -c]
    command:
      - printf '%s' "$$METRICS_TOKEN" > /etc/prometheus/metrics-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    ports: ['127.0.0.1:9093:9093']
    volumes: ['./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    depends_on:
      - webhook-receiver
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  # Local Alertmanager webhook receiver: every page-severity alert is POSTed
  # here and appended to D:\bothive\data\webhook-capture.jsonl. To change the
  # destination, point the bothive-webhook receiver in ./alertmanager.yml at a
  # real PagerDuty/Opsgenie/Slack endpoint instead.
  webhook-receiver:
    image: node:20-alpine
    ports: ['127.0.0.1:9999:9999']
    environment:
      WEBHOOK_PORT: '9999'
      WEBHOOK_CAPTURE: /data/webhook-capture.jsonl
    volumes:
      - ./webhook-receiver.js:/app/webhook-receiver.js:ro
      - D:\bothive\data:/data
    command: ['node', '/app/webhook-receiver.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9999/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
