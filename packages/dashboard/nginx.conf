server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Per-client-IP zone for auth endpoints. The API also rate-limits
    # (Redis-backed: 10/min on /api/auth/login, 5/h on register, 5/min on
    # password change), but shedding floods here keeps them away from Node
    # entirely. 10 MB holds ~160k distinct IPs.
    limit_req_zone $binary_remote_addr zone=bothive_auth:10m rate=10r/m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        # Brute-force protection (login/register/password): 10 req/min per IP
        # sustained, 5-burst allowance. nginx answers 429 before Node sees the
        # request. Longer prefix than /api/, so it always wins.
        limit_req zone=bothive_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP to the API,
        # which trusts X-Forwarded-For when TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
