<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Маскable-иконка.

    Отличие от обычной icon.svg — безопасная зона. Android при маскировании
    обрезает иконку по кругу, квадрату или «капле», и всё, что ближе ~10%
    края, может отрезаться. Поэтому здесь рисунок уменьшен и сдвинут в
    центр: молния занимает центральные 60% полотна, а фон залит целиком,
    чтобы обрезка не оставляла прозрачных углов.
  -->
  <rect width="64" height="64" fill="#f7f5f0" />
  <path
    transform="translate(32 32) scale(0.62) translate(-32 -32)"
    d="M34 8 14 38h15L30 56l20-30H35L34 8Z"
    fill="#9a2a22"
  />
</svg>