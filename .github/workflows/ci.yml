name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test & typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests run against a dedicated test Postgres + Redis (see vitest.setup.ts:
    # postgres bothive_test on :5434, redis on :6379). Service containers map
    # host:5434 -> container:5432 and host:6379 -> container:6379 to match.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bothive
          POSTGRES_PASSWORD: bothive_test_pw
          POSTGRES_DB: bothive_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bothive -d bothive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma 7 is config-driven (prisma.config.ts) and emits TypeScript
      # sources; db:generate compiles them to JS at
      # packages/api/prisma/generated/prisma (imported by src/types.d.ts).
      - name: Generate and compile Prisma client
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run db:generate

      - name: Build
        run: npm run build

      # `build` typechecks sources only (test files are excluded from each
      # package tsconfig); this also typechecks the tests.
      - name: Typecheck sources and tests
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Dummy values only for `${VAR:?...}` interpolation in the compose file;
      # real secrets are injected by Docker Hub only on publish.
      JWT_SECRET: ci
      ENCRYPTION_KEY: ci
      PASSWORD_PEPPER: ci
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

  docker:
    name: Build image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 40
    env:
      # `secrets` is not available in step-level `if:` (it would make the whole
      # workflow invalid), so hoist the "have Docker Hub credentials" gate into
      # job-level env, which may reference secrets; step `if:` may reference env.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: ssrjkk/bothive-api
          - target: workers
            image: ssrjkk/bothive-workers
          - target: dashboard
            image: ssrjkk/bothive-dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Publishes only when Docker Hub credentials are configured; on PRs and
      # repos without secrets the build still runs so a broken Dockerfile is
      # caught before it reaches main.
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds every target on PRs too (catches a broken Dockerfile before it
      # reaches main); pushes only on main. One build step per target — a
      # multi-tag `build-push-action` without `target` silently builds the last
      # stage and tags all three images with it.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
