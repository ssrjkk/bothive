groups:
  - name: bothive
    rules:
      # Prometheus cannot scrape the API (empty METRICS_TOKEN, API down, network
      # failure). `up` is 1 while scrapes succeed.
      - alert: ApiUnreachable
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'API is unreachable for Prometheus scrapes'

      # A spike of 5xx responses usually means a code or dependency problem, not
      # a slow client.
      - alert: ApiHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5[0-9][0-9]"}[5m])
            / clamp_min(rate(http_requests_total[5m]), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API 5xx rate above 5% over the last 10 minutes'

      # Slow p95 responses degrade the dashboard and the scrape itself.
      - alert: ApiSlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API p95 latency above 5s over the last 10 minutes'

      # Workers publish a heartbeat every 10s (TTL 30s); bothive_worker_up is 0
      # when a platform has no fresh heartbeat. Fire once ALL platforms are down.
      - alert: AllWorkersDown
        expr: sum(bothive_worker_up) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'No worker is alive for any platform'

      - alert: WorkerDown
        expr: bothive_worker_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Worker for platform {{ $labels.platform }} has been down for 15 minutes'

      # A sustained backlog means jobs are produced faster than workers consume.
      - alert: QueueBacklog
        expr: bothive_queue_jobs_total{state="waiting"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has over 100 waiting jobs for 15 minutes'

      # BullMQ trims failed jobs (keep 50), so a non-zero failed count for a
      # sustained period means deliveries/connects keep failing.
      - alert: QueueFailures
        expr: bothive_queue_jobs_total{state="failed"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has failed jobs for 30 minutes'

      # Workers publish a 0-100 health score per bot; sustained low scores
      # indicate a platform-side or credential problem worth a look.
      - alert: BotUnhealthy
        expr: bothive_bot_health_score < 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Bot {{ $labels.bot_id }} health score below 50 for 15 minutes'

      # A proxy that stays at health score 0 has failed its probe (and every
      # worker connect routed through it decayed its score to zero). Bots
      # silently fall back to direct connections or other proxies, so this is
      # the only signal that a configured egress endpoint is dead.
      - alert: ProxyUnhealthy
        expr: bothive_proxy_health_score == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Proxy {{ $labels.proxy_id }} has been unhealthy for 10 minutes'

      # --- SLO burn-rate alerts (docs/slo.md) ------------------------------
      #
      # These page on error-budget burn, multi-window: 14.4x over 1h catches a
      # full outage fast, 6x over 6h catches slow degradation. Exceeding the
      # error budget 14.4x for an hour consumes ~1.4 days of the monthly budget.
      - alert: ApiAvailabilityBurnRate
        expr: |
          sum(rate(http_requests_total{status=~"5[0-9][0-9]"}[1h]))
            / clamp_min(sum(rate(http_requests_total[1h])), 1e-9)
          > 0.005 * 14.4
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'API availability SLO (99.5%) burning fast: 14.4x over the last hour'

      - alert: ApiAvailabilityBurnRateSlow
        expr: |
          sum(rate(http_requests_total{status=~"5[0-9][0-9]"}[6h]))
            / clamp_min(sum(rate(http_requests_total[6h])), 1e-9)
          > 0.005 * 6
        for: 15m
        labels:
          severity: page
        annotations:
          summary: 'API availability SLO (99.5%) burning at 6x over the last 6 hours'

      # Latency SLO: p95 >= 300ms sustained for 10 minutes is a budget burn on
      # the latency objective (docs/slo.md).
      - alert: ApiLatencySLOPage
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.3
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'API p95 latency above the 300ms SLO for 10 minutes'

      # Scripts failing more than 20% of runs over 10 minutes usually means a
      # script references a payload field, chat or action that no longer exists.
      # Both series are TRUE counters: workers count one execution and one error
      # per script RUN (not per action), and the API converts the cumulative
      # counters into scrape-to-scrape deltas, so the rate ratio is meaningful.
      - alert: ScriptFailureSpike
        expr: |
          rate(bothive_bot_script_errors_total[5m])
            / clamp_min(rate(bothive_bot_script_executions_total[5m]), 1e-9) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Bot {{ $labels.bot_id }} script failure rate above 20% for 10 minutes'

      # Jobs sitting queued long enough to push p95 wait time up means the
      # platform worker is backed up (slow platform calls, tight concurrency)
      # even when the waiting count itself still looks small.
      - alert: QueueHighWait
        expr: bothive_queue_wait_seconds{quantile="p95"} > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Queue wait time p95 above 30s on platform {{ $labels.platform }} for 10 minutes'

      # Heap used growing past 512MiB in an hour is a leak in the worker process
      # (streaming buffers, caches); a restart clears it short-term.
      - alert: WorkerMemoryGrowth
        expr: delta(bothive_worker_memory_bytes{type="heapUsed"}[1h]) > 536870912
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Worker heap on {{ $labels.platform }} grew more than 512MiB in an hour'

      # Live script-sandbox worker threads are created per custom action and
      # terminated when the action finishes. A count that keeps climbing means a
      # runaway script is leaking threads (each pinned to the process heap).
      - alert: WorkerSandboxLeak
        expr: delta(bothive_worker_sandbox_workers[30m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Worker on {{ $labels.platform }} accumulated more than 10 sandbox threads in 30 minutes'

      # 5+ reconnect attempts in 5 minutes means a bot keeps failing to connect
      # (banned account, bad token, dead proxy) and is churning the platform API.
      # bothive_bot_reconnect_attempts_total is a true counter (the API converts
      # the worker's cumulative counter into scrape-to-scrape deltas), so
      # increase() here is meaningful.
      - alert: BotReconnectThrashing
        expr: increase(bothive_bot_reconnect_attempts_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Bot {{ $labels.bot_id }} reconnected more than 5 times in 5 minutes'
