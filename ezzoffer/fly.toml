# Fly.io — деплой EZOffer.
#
# Три вещи, которые здесь принципиальны, и их нельзя убрать:
#
# 1. internal_port = 3000, а НЕ 8080. Dockerfile собирает standalone с
#    PORT=3000 и EXPOSE 3000. Fly по умолчанию предлагает 8080, и с таким
#    портом прокси Fly не достучится до приложения: отдаёт 502, страница не
#    открывается.
#
# 2. Том обязателен. Без него SQLite-файл лежит во временной файловой
#    системе и ИСЧЕЗАЕТ при каждой пересборке машины. Аккаунты, резюме и
#    отклики пропадут молча, без ошибки.
#
# 3. Одна машина. SQLite — база с одним писателем; две машины на одном томе
#    дадут блокировки и «database is locked».

app = "ezzoffer"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  SITE_URL = "https://ezzoffer.fly.dev"
  EZOFFER_DB_PATH = "/app/data/ezoffer.db"
  EZOFFER_SILENT = "0"
  TRUST_PROXY = "1"
  # Домен подставишь, когда появится свой: SITE_URL участвует в OAuth
  # redirect_uri, в письмах и в sitemap. Менять здесь, а не в коде.

# Лимит автооткликов. 0 означает «без потолка», а не «выключено»,
  # поэтому на пустом месте поставлено 1.
  AUTOAPPLY_DAILY_CAP = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # Машина засыпает при простое и просыпается по запросу. Экономно, но
  # планировщик откликов живёт в процессе: пока спит, он не тикает.
  # auto_stop_machines = "off" держит его включённым — это уже за деньги.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Проверка живости. Без неё Fly не понимает, что процесс поднялся, и
    # может маршрутизировать на машину, которая ещё не готова.
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 256 МБ — минимум Fly. Next standalone на нём запускается, но сборка
  # (next build) требует заметно больше, поэтому образ в CI собирается
  # отдельно, а машина только исполняет готовый.
  memory = "256mb"

[mounts]
  source = "ezdata"
  destination = "/app/data"