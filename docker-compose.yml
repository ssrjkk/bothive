name: bothive

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bothive
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bothive']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ssrjkk/bothive-api
    build:
      context: .
      target: api
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bothive
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set (see .env.example)}
      API_PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'true'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One process per platform: a crash in one platform never takes down the
  # others, and each can be scaled independently (docker compose up --scale
  # workers-telegram=2). All share the same workers image.
  workers-telegram:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command: ['node', 'dist/index.js', '--platform', 'telegram']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bothive
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  workers-twitch:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'twitch']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bothive
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  workers-youtube:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'youtube']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bothive
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  workers-twitter:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'twitter']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bothive
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ssrjkk/bothive-dashboard
    build:
      context: .
      target: dashboard
    ports:
      - '80:80'
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
