name: bothive

# Shared worker healthcheck: verifies Redis reachability from inside the
# workers container (see packages/workers/healthcheck.cjs).
x-worker-healthcheck: &worker-healthcheck
  test: ['CMD', 'node', '/app/packages/workers/healthcheck.cjs']
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

# Bounds each service's Prisma pool (default is CPU-based and can be large on
# big hosts), so a scaled worker fleet cannot exhaust Postgres connections.
x-db-url: &db-url postgresql://postgres:postgres@postgres:5432/bothive?connection_limit=10

# Optional Redis auth: when REDIS_PASSWORD is set every consumer passes it and
# the redis service starts with requirepass. Unset = open Redis (default).
x-redis-password: &redis-password ${REDIS_PASSWORD:-}

# Optional Sentry error tracking. Empty by default — the SDK stays a no-op in
# the API and workers until SENTRY_DSN is set (packages/core/src/utils/sentry.ts).
x-sentry-env: &sentry-env
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

services:
  postgres:
    image: postgres:16-alpine
    # pg_stat_statements: per-query execution stats for slow-query triage
    # (docs/query-performance.md). shared_preload_libraries must be set before
    # the server starts, so it goes on the command line.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bothive
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bothive']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Cap Redis memory (docs/capacity-planning.md). volatile-lru evicts only
      # TTL'd ephemeral keys (rate-limit counters, leases, dedup, bot memory)
      # under pressure; queue keys (no TTL) are protected from eviction.
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" \
            --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY" \
            --appendonly yes --appendfsync everysec
        else
          exec redis-server \
            --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY" \
            --appendonly yes --appendfsync everysec
        fi
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      # Persist AOF + RDB snapshots so Redis state survives container recreation.
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ssrjkk/bothive-api
    build:
      context: .
      target: api
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set (see .env.example)}
      API_PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'true'
      EXPOSE_ERROR_STACK: ${EXPOSE_ERROR_STACK:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # HTTP/2 is opt-in (h2c prior-knowledge only). Leave off: the dashboard
      # nginx and the healthcheck speak HTTP/1.1, and cleartext h2c servers do
      # NOT fall back to HTTP/1.1 (allowHTTP1 needs a TLS/ALPN server). Enable
      # only if a TLS-terminating LB proxies to the API over h2c.
      API_HTTP2: 'false'
      <<: *sentry-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One process per platform: a crash in one platform never takes down the
  # others, and each can be scaled independently (docker compose up --scale
  # workers-telegram=2). All share the same workers image.
  workers-telegram:
    image: ssrjkk/bothive-workers
    build:
      context: .
      target: workers
    command: ['node', 'dist/index.js', '--platform', 'telegram']
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      # Cap the worker heap so a long-lived process stays within its container
      # memory limit (docs/capacity-planning.md).
      NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-512}
      <<: *sentry-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck

  workers-twitch:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'twitch']
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      # Cap the worker heap so a long-lived process stays within its container
      # memory limit (docs/capacity-planning.md).
      NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-512}
      <<: *sentry-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck

  workers-youtube:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'youtube']
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      # Cap the worker heap so a long-lived process stays within its container
      # memory limit (docs/capacity-planning.md).
      NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-512}
      <<: *sentry-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck

  workers-twitter:
    image: ssrjkk/bothive-workers
    command: ['node', 'dist/index.js', '--platform', 'twitter']
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: *redis-password
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      # Cap the worker heap so a long-lived process stays within its container
      # memory limit (docs/capacity-planning.md).
      NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-512}
      <<: *sentry-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *worker-healthcheck

  dashboard:
    image: ssrjkk/bothive-dashboard
    build:
      context: .
      target: dashboard
    ports:
      - '80:80'
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '127.0.0.1:9090:9090'
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - printf '%s' "$$METRICS_TOKEN" > /etc/prometheus/metrics-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bothive.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
