name: Release

# Push a `v*` tag to cut a release:
#   git tag v1.2.3 && git push origin v1.2.3
# Publishes semver-tagged Docker images and drafts a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  images:
    name: Publish image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: ssrjkk/bothive-api
          - target: workers
            image: ssrjkk/bothive-workers
          - target: dashboard
            image: ssrjkk/bothive-dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-release-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog from commits
        id: changelog
        run: |
          previous="$(
            git describe --tags --abbrev=0 "${{ github.ref_name }}"^ 2>/dev/null \
              || git rev-list --max-parents=0 HEAD
          )"
          {
            printf '## Changes since %s\n\n' "${previous}"
            git log --oneline --no-merges "${previous}..${{ github.ref_name }}"
          } > /tmp/changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/changelog.md
          draft: true
