# Alertmanager config. SLO burn-rate alerts (labels.severity="page", see
# prometheus/rules/bothive.yml) are routed to the webhook receiver below;
# everything else goes to the null receiver so it is evaluated and visible in
# the Prometheus/Alertmanager UI without spamming anyone.
#
# By default, page alerts go to the bundled webhook-receiver container
# (http://webhook-receiver:9999/bothive-alerts) which logs them to
# D:\bothive\data\webhook-capture.jsonl.
#
# To send to a real endpoint (PagerDuty/Opsgenie/Slack/Telegram):
#   1. Edit the url below (or set ALERTMANAGER_WEBHOOK_URL env var — see step 2).
#   2. Add environment ALERTMANAGER_WEBHOOK_URL to the alertmanager service in
#      docker-compose.yml and replace the url with '${ALERTMANAGER_WEBHOOK_URL}'.
#   3. Restart: docker compose restart alertmanager
#   4. Verify:  curl -s http://localhost:9093/api/v2/alerts | jq length

route:
  receiver: null-receiver
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: bothive-webhook
      continue: false

receivers:
  - name: null-receiver
  - name: bothive-webhook
    webhook_configs:
      - url: 'http://webhook-receiver:9999/bothive-alerts'
        send_resolved: true
