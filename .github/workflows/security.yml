name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-config:
    name: Trivy Dockerfile / compose misconfig scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Static misconfiguration scan of Dockerfile and docker-compose.yml.
      # The checks are aligned with the CIS Docker Benchmark (image/build file
      # section); we keep exit-code 0 so advisory findings do not block PRs,
      # and upload the SARIF report to the Security tab for triage.
      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          format: sarif
          output: trivy-config-results.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
          scanners: misconfig

      - name: Upload Trivy config results to GitHub Security tab
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config-results.sarif

  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates on HIGH/CRITICAL production vulnerabilities across all
      # workspaces; dev/tooling-only advisories are excluded to keep the
      # pipeline green on cosmetic issues.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # JS/TS CodeQL is interpreted (no build step), so analyze straight away.
      - uses: github/codeql-action/analyze@v4

  trivy:
    name: Trivy image scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: ssrjkk/bothive-api
            # Current uncompressed size is ~1.6 GB (workspaces cause npm to pull
            # all production deps into the runtime image). This ceiling catches
            # gross bloat until the Dockerfile is optimized to scope installs.
            limit_mb: 1800
          - target: workers
            image: ssrjkk/bothive-workers
            limit_mb: 1800
          - target: dashboard
            image: ssrjkk/bothive-dashboard
            limit_mb: 300
    env:
      # Dummy values only for `${VAR:?...}` interpolation in docker-compose.yml.
      JWT_SECRET: ci
      ENCRYPTION_KEY: ci
      PASSWORD_PEPPER: ci
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose build ${{ matrix.target }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ssrjkk/bothive-${{ matrix.target }}:latest
          format: sarif
          output: trivy-results-${{ matrix.target }}.sarif
          # Keep the scan running and upload SARIF to the Security tab, but do
          # not fail the build on upstream base-image vulnerabilities (the
          # dashboard image already hits intermittent HIGH findings from
          # nginx:alpine). npm-audit and CodeQL still gate source-level issues.
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          limit-severities-for-sarif: 'true'

      # Upload findings to the GitHub Security tab even when the gate reports.
      - name: Upload Trivy results to GitHub Security tab
        if: ${{ always() && hashFiles(format('trivy-results-{0}.sarif', matrix.target)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-${{ matrix.target }}.sarif

      # Software Bill of Materials (CycloneDX) for the built image — useful for
      # vulnerability disclosure, license compliance and reproduction of builds.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ssrjkk/bothive-${{ matrix.target }}:latest
          format: cyclonedx
          output: sbom-${{ matrix.target }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.cdx.json

      # Guard against image bloat. The image is already in the local daemon
      # (docker compose build above); inspect its uncompressed size and fail
      # when it exceeds the per-target ceiling.
      - name: Check image size
        shell: bash
        run: |
          size_mb=$(docker image inspect "ssrjkk/bothive-${{ matrix.target }}:latest" \
            --format '{{ .Size }}' | awk '{ printf "%.0f", $1 / 1048576 }')
          echo "image size: ${size_mb} MB (limit ${{ matrix.limit_mb }} MB)"
          if [ "${size_mb}" -gt "${{ matrix.limit_mb }}" ]; then
            echo "::error::bothive-${{ matrix.target }} image is ${size_mb} MB — over the ${{ matrix.limit_mb }} MB ceiling; check for dev deps or build artifacts leaking into the runtime image"
            exit 1
          fi
